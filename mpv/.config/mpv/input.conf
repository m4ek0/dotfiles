CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K — Mode A (1080p source)"

CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K — Mode B (720p source)"

CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K — Mode C (480p source)"

CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Shaders cleared"

CTRL+d  cycle deband                    ; show-text "Deband: ${deband}"
CTRL+i  cycle interpolation             ; show-text "Interpolation: ${interpolation}"
CTRL+h  cycle-values hwdec "no" "auto-safe" ; show-text "hwdec: ${hwdec-current}"

CTRL+f  cycle-values sub-ass-override "yes" "no" ; show-text "ASS override: ${sub-ass-override}"

RIGHT   seek  5
LEFT    seek -5
UP      seek  60
DOWN    seek -60
SHIFT+n seek  90                        ; show-text "Skipped OP"

z       add sub-delay -0.05
Z       add sub-delay  0.05
CTRL+z  set sub-delay 0                 ; show-text "Sub delay reset"

s       screenshot
S       screenshot video
CTRL+s  screenshot window

l       ab-loop
[       multiply speed 1/1.1
]       multiply speed 1.1
BS      set speed 1                     ; show-text "Speed reset"

v       cycle sub-visibility
CTRL+v  cycle secondary-sub-visibility

Alt+r   cycle-values video-rotate "90" "180" "270" "0"

MBTN_RIGHT script-binding uosc/menu
TAB        script-binding uosc/toggle-ui
p          script-binding uosc/items          # playlist / episode list
c          script-binding uosc/chapters
CTRL+a     script-binding uosc/audio
CTRL+j     script-binding uosc/subtitles      # sub track picker
o          script-binding uosc/open-file
PGUP       script-binding uosc/prev
PGDWN      script-binding uosc/next
