vo=gpu-next
gpu-api=opengl
hwdec=auto-safe
profile=high-quality

deband=yes
deband-iterations=2
deband-threshold=40
deband-range=18
deband-grain=8

dither-depth=auto
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

video-sync=display-resample
interpolation=yes
tscale=oversample

blend-subtitles=no

sub-ass-override=yes
sub-ass-style-overrides=Default.FontName=Atkinson Hyperlegible Next SemiBold,Default.Bold=0,Default-alt.FontName=Atkinson Hyperlegible Next SemiBold,Default-alt.Bold=0,Default - Top.FontName=Atkinson Hyperlegible Next SemiBold,Default - Top.Bold=0,Default-Top.FontName=Atkinson Hyperlegible Next SemiBold,Default-Top.Bold=0,Default Top.FontName=Atkinson Hyperlegible Next SemiBold,Default Top.Bold=0,Main.FontName=Atkinson Hyperlegible Next SemiBold,Main.Bold=0,Main Top.FontName=Atkinson Hyperlegible Next SemiBold,Main Top.Bold=0,Main - Top.FontName=Atkinson Hyperlegible Next SemiBold,Main - Top.Bold=0,Main-Top.FontName=Atkinson Hyperlegible Next SemiBold,Main-Top.Bold=0,Top.FontName=Atkinson Hyperlegible Next SemiBold,Top.Bold=0,Dialogue.FontName=Atkinson Hyperlegible Next SemiBold,Dialogue.Bold=0,Dialog.FontName=Atkinson Hyperlegible Next SemiBold,Dialog.Bold=0,Italics.FontName=Atkinson Hyperlegible Next SemiBold,Italics.Bold=0,Italic.FontName=Atkinson Hyperlegible Next SemiBold,Italic.Bold=0,Default Italic.FontName=Atkinson Hyperlegible Next SemiBold,Default Italic.Bold=0,Main Italic.FontName=Atkinson Hyperlegible Next SemiBold,Main Italic.Bold=0,Flashback.FontName=Atkinson Hyperlegible Next SemiBold,Flashback.Bold=0,Flashback Italics.FontName=Atkinson Hyperlegible Next SemiBold,Flashback Italics.Bold=0,Overlap.FontName=Atkinson Hyperlegible Next SemiBold,Overlap.Bold=0,Alt.FontName=Atkinson Hyperlegible Next SemiBold,Alt.Bold=0,Internal.FontName=Atkinson Hyperlegible Next SemiBold,Internal.Bold=0,Thoughts.FontName=Atkinson Hyperlegible Next SemiBold,Thoughts.Bold=0,Narration.FontName=Atkinson Hyperlegible Next SemiBold,Narration.Bold=0,Narrator.FontName=Atkinson Hyperlegible Next SemiBold,Narrator.Bold=0,Secondary.FontName=Atkinson Hyperlegible Next SemiBold,Secondary.Bold=0,DefaultItalics.FontName=Atkinson Hyperlegible Next SemiBold,DefaultItalics.Bold=0,DefaultTop.FontName=Atkinson Hyperlegible Next SemiBold,DefaultTop.Bold=0,DefaultItalicsTop.FontName=Atkinson Hyperlegible Next SemiBold,DefaultItalicsTop.Bold=0,DefaultOverlap.FontName=Atkinson Hyperlegible Next SemiBold,DefaultOverlap.Bold=0,DefaultItalicsOverlap.FontName=Atkinson Hyperlegible Next SemiBold,DefaultItalicsOverlap.Bold=0,FlashbackItalics.FontName=Atkinson Hyperlegible Next SemiBold,FlashbackItalics.Bold=0,FlashbackTop.FontName=Atkinson Hyperlegible Next SemiBold,FlashbackTop.Bold=0,FlashbackItalicsTop.FontName=Atkinson Hyperlegible Next SemiBold,FlashbackItalicsTop.Bold=0,MainItalics.FontName=Atkinson Hyperlegible Next SemiBold,MainItalics.Bold=0,MainTop.FontName=Atkinson Hyperlegible Next SemiBold,MainTop.Bold=0,MainOverlap.FontName=Atkinson Hyperlegible Next SemiBold,MainOverlap.Bold=0,ItalicsTop.FontName=Atkinson Hyperlegible Next SemiBold,ItalicsTop.Bold=0,Default Italics.FontName=Atkinson Hyperlegible Next SemiBold,Default Italics.Bold=0,Default Overlap.FontName=Atkinson Hyperlegible Next SemiBold,Default Overlap.Bold=0,Overlap Italics.FontName=Atkinson Hyperlegible Next SemiBold,Overlap Italics.Bold=0,Top Italics.FontName=Atkinson Hyperlegible Next SemiBold,Top Italics.Bold=0,Thought.FontName=Atkinson Hyperlegible Next SemiBold,Thought.Bold=0,Internal Italics.FontName=Atkinson Hyperlegible Next SemiBold,Internal Italics.Bold=0,NarrationTop.FontName=Atkinson Hyperlegible Next SemiBold,NarrationTop.Bold=0
sub-font="Atkinson Hyperlegible Next SemiBold"
sub-font-size=46
sub-bold=no

sub-color="#F2EBE0"
sub-border-color="#12100E"
sub-shadow-color="#000000"

sub-border-size=2.6
sub-shadow-offset=1.5
sub-blur=0.3
sub-spacing=0.3

sub-margin-y=54
sub-use-margins=yes
sub-ass-force-margins=yes
sub-fix-timing=yes
demuxer-mkv-subtitle-preroll=yes

sub-auto=fuzzy
sub-file-paths=subs:subtitles:Subs:Subtitles

alang=jpn,ja,jp
slang=eng,en,en-US,enUS
subs-with-matching-audio=no

volume=100
volume-max=200

audio-channels=stereo
audio-normalize-downmix=yes

audio-file-auto=fuzzy
audio-pitch-correction=yes

osd-font="Maple Mono NF CN"
osd-font-size=28
osd-color="#E1E2E6"
osd-border-color="#111416"
osd-border-size=1.5
osd-duration=1600

osc=no
osd-bar=no

save-position-on-quit=yes
watch-later-options=start,vid,aid,sid

keep-open=yes
force-window=immediate
cursor-autohide=1000
cursor-autohide-fs-only=yes
autofit-larger=90%x90%
border=no
title="${?media-title:${media-title}}${!media-title:mpv}"

screenshot-format=png
screenshot-png-compression=7
screenshot-high-bit-depth=yes
screenshot-directory="~/Pictures/mpv"
screenshot-template="%F - [%P]"

cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=200MiB
force-seekable=yes
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"
