//
try {
  Services.obs.addObserver(win => {
    const page = "file://" + Services.env.get("HOME") + "/.config/startpage/index.html";
    const bar = win.gURLBar;
    const onPage = () => { try { return win.gBrowser.selectedBrowser.currentURI.spec === page; } catch (e) { return false; } };
    const typed = () => win.gBrowser.userTypedValue || (bar.focused && bar.value);
    const clear = () => { if (onPage() && !bar.focused && !win.gBrowser.userTypedValue) bar.value = ""; };
    const grab = () => {
      if (!onPage() || bar.focused) return;
      const v = typed() || "";
      bar.focus();
      bar.value = v;
      bar.inputField.setSelectionRange(v.length, v.length);
    };
    win.gBrowser.addProgressListener({
      onLocationChange() { win.setTimeout(clear, 0); },
      onStateChange(b, req, flags) {
        if (flags & Components.interfaces.nsIWebProgressListener.STATE_STOP && flags & Components.interfaces.nsIWebProgressListener.STATE_IS_WINDOW) win.setTimeout(grab, 0);
      },
    });
    win.gBrowser.tabContainer.addEventListener("TabSelect", () => win.setTimeout(clear, 0));
    bar.inputField.addEventListener("blur", () => win.setTimeout(clear, 0));
    if (Services.prefs.getStringPref("browser.startup.homepage", "") === page) bar.focus();
  }, "browser-delayed-startup-finished");
} catch (e) {}
