<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root {
  --bg: {{colors.surface.default.hex}};
  --card: {{colors.surface_container.default.hex}};
  --text: {{colors.on_surface.default.hex}};
  --muted: {{colors.on_surface_variant.default.hex}};
  --accent: {{colors.primary.default.hex}};
  --accent-2: {{colors.tertiary.default.hex}};
  --accent-soft: {{colors.primary_container.default.hex}};
  --on-accent-soft: {{colors.on_primary_container.default.hex}};
  --outline: {{colors.outline_variant.default.hex}};
}
</style>
<script>window.LOC = null; /*LOC*/</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23{{colors.primary.default.hex_stripped}}' d='M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z'/%3E%3C/svg%3E">
<style>
  :root { --font: "Maple Mono NF CN", "Maple Mono NF", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4vh;
  }
  .wall {
    position: fixed; inset: 0; z-index: -2;
    background: var(--bg) url("/*WALLPAPER*/") center / 2020px 1136px no-repeat;
  }
  .tint {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 70% 55% at 50% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
      linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 55%, transparent));
  }
  main {
    width: min(560px, calc(100vw - 32px));
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .clock {
    font-size: clamp(64px, 10vw, 110px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .clock span { color: var(--accent); }
  .date {
    margin-top: -12px;
    font-size: 14px;
    color: var(--muted);
    opacity: .75;
  }
  .hint { font-size: 13px; color: var(--muted); opacity: .6; margin-top: -8px; min-height: 1em; }
  nav { display: flex; gap: 22px; font-size: 13px; }
  nav a {
    color: var(--muted);
    opacity: .7;
    text-decoration: none;
    transition: color .15s, opacity .15s;
  }
  nav a:hover, nav a:focus-visible { color: var(--accent); opacity: 1; outline: none; }
</style>
</head>
<body>
<div class="wall"></div><div class="tint"></div>
<main>
  <div class="clock" id="clock">00<span>:</span>00</div>
  <div class="date" id="date"></div>
  <div class="hint" id="weather"></div>
  <nav>
    <a href="https://www.youtube.com">youtube</a>
    <a href="https://x.com">twitter</a>
    <a href="https://web.telegram.org">telegram</a>
  </nav>
</main>
<script>
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    document.getElementById("clock").innerHTML = `${pad(d.getHours())}<span>:</span>${pad(d.getMinutes())}`;
    document.getElementById("date").textContent =
      d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }).toLowerCase();
  }
  tick(); setInterval(tick, 1000);

  const WMO = {0:"clear",1:"mostly clear",2:"partly cloudy",3:"cloudy",45:"fog",48:"fog",51:"drizzle",53:"drizzle",55:"drizzle",
    56:"freezing drizzle",57:"freezing drizzle",61:"light rain",63:"rain",65:"heavy rain",66:"freezing rain",67:"freezing rain",
    71:"light snow",73:"snow",75:"heavy snow",77:"snow grains",80:"showers",81:"showers",82:"heavy showers",85:"snow showers",86:"snow showers",
    95:"thunderstorm",96:"thunderstorm",99:"thunderstorm"};
  async function weather() {
    try {
      if (!window.LOC) return;
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lon}&current=temperature_2m,apparent_temperature,weather_code`);
      const c = (await r.json()).current;
      document.getElementById("weather").textContent =
        `${Math.round(c.temperature_2m)}° ${WMO[c.weather_code] ?? ""} · feels ${Math.round(c.apparent_temperature)}°`;
    } catch (e) {}
  }
  weather(); setInterval(weather, 15 * 60 * 1000);
</script>
</body>
</html>
